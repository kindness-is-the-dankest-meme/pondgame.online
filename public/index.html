<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pondgame.online</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <svg
        id="pond"
        width="100%"
        height="100%"
        preserveAspectRatio="xMidYMid meet"
        fill="none"
        stroke="currentColor"
      >
      </svg>
      <div>
        <input type="range" name="size" id="size" min="20" max="100" step="1" />
        <button type="button" name="full" id="full">⛶</button>
      </div>
    </main>
    <script type="module" src="entry.js"></script>
  </body>
</html>
