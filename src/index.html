<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello</title>
  </head>
  <body>
    <main>Hello</main>
    <script type="module">
      const { host, protocol } = location;

      ws.addEventListener("message", ({ data }) => console.log(data));
    </script>
  </body>
